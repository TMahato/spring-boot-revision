plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is used by the application.
    implementation libs.guava

    // JSON serialization / deserialization for the local "database" files.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    // Support for java.time types (LocalDate on Ticket).
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'

    // BCrypt password hashing (UserServiceUtil).
    implementation 'org.mindrot:jbcrypt:0.4'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}

// The local "database" paths are relative to the project root, so run from there.
run {
    workingDir = rootProject.projectDir
    // Keep console input working for the Scanner-based menu.
    standardInput = System.in
}
