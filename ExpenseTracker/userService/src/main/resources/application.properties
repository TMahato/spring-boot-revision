spring.application.name=userService
server.port=9810

# ---------------------------------------------------------------------------
# Kafka. Must point at the SAME broker as the auth service (ExpenseTracker).
# A remote broker must advertise a reachable address —
# advertised.listeners=PLAINTEXT://<host-ip>:9092 in its server.properties,
# otherwise clients connect once and then time out.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

# The consumer group: the identity Kafka tracks offsets against. Must be stable
# across restarts, and different from any other service's group — each group gets
# its own copy of every message.
spring.kafka.consumer.group-id=userinfo-consumer-group

# earliest: on first start (no committed offset) read from the beginning instead
# of skipping everything published before this service existed.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.jassi.userservice.deserializer.UserInfoDeserializer

# How long a consumer may go between poll() calls before the group considers it
# dead and rebalances (5 min), and how long without a heartbeat before eviction (45s).
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.session.timeout.ms=45000

# Don't refuse to start when the topic doesn't exist yet (dev convenience).
spring.kafka.listener.missing-topics-fatal=false

# Topic to consume. Must match app.kafka.topic.name in the auth service.
app.kafka.topic.name=user-info-topic

# ---------------------------------------------------------------------------
# Database (MySQL) — this service owns the `userservice` schema. The auth
# service owns `authservice` on the same server and neither reads the other's
# tables. Override host/port/db/credentials with env vars.
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:userservice}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

spring.jpa.show-sql=true
# `update` by default now: `create` drops & recreates the schema on EVERY
# startup, which makes the mysql-data docker volume pointless — the app would
# destroy the data the volume just preserved. Override with JPA_DDL_AUTO=create
# when you deliberately want a clean slate. See notes/chapter-7 §7.4.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO

# ---------------------------------------------------------------------------
# Actuator. /actuator/health is polled by the docker-compose healthcheck and
# gates Kong's startup. Unlike the hand-rolled /health in UserController (which
# always returns true), this one runs a DataSource validation query, so an app
# that has lost MySQL correctly reports DOWN. See notes/chapter-7 §7.3.
# This service has no Spring Security, so nothing needs permitting.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
