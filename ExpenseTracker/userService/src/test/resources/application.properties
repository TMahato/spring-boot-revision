# Test config. Note this file REPLACES the main application.properties rather than
# merging with it — test-classes comes first on the classpath and Boot loads only
# one application.properties — so every key the beans need must be repeated here.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=userinfo-consumer-group
app.kafka.topic.name=user-info-topic

# No live MySQL needed: run on in-memory H2 instead.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:userservice;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Don't start listener containers during a plain context-load test — otherwise
# they poll a broker that isn't there and spam connection warnings.
spring.kafka.listener.auto-startup=false
