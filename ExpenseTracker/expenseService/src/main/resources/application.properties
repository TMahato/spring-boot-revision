spring.application.name=expenseService
server.port=9820

# ---------------------------------------------------------------------------
# Kafka. Must point at the SAME broker as dsService.
# Under docker compose KAFKA_HOST is the compose service name `kafka` — inside a
# container `localhost` is that container. See notes/chapter-7 §5.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

# The consumer group: the identity Kafka tracks offsets against. Must be stable
# across restarts, and different from any other service's group — each group gets
# its own copy of every message.
spring.kafka.consumer.group-id=expense-info-consumer-group

# earliest: on first start (no committed offset) read from the beginning instead
# of skipping everything published before this service existed.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ErrorHandlingDeserializer wraps our deserializer: it catches the exception and
# passes a null payload plus the failure in a header, so DefaultErrorHandler can
# route the record to the DLT instead of the partition stalling forever on a
# poison pill. See notes/chapter-6 §9.2 and KafkaConsumerConfig.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=com.jassi.expenseservice.consumer.ExpenseDeserializer

# How long a consumer may go between poll() calls before the group considers it
# dead and rebalances (5 min), and how long without a heartbeat before eviction (45s).
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.session.timeout.ms=45000

# Don't refuse to start when the topic doesn't exist yet (dev convenience).
spring.kafka.listener.missing-topics-fatal=false

# Producer config exists ONLY so DeadLetterPublishingRecoverer has a
# KafkaTemplate to publish failed records with. This service produces nothing else.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Topic to consume. MUST match dsService's KAFKA_TOPIC — that string is the whole
# contract between the two services (notes/chapter-6 §1).
app.kafka.topic.name=${KAFKA_TOPIC:expense-topic}

# ---------------------------------------------------------------------------
# Database (MySQL) — this service owns the `expenseservice` schema. The auth and
# user services own their own on the same server; none reads another's tables.
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:expenseservice}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

spring.jpa.show-sql=true
# `update` keeps data across restarts, so the mysql-data volume is meaningful.
# The reference set ddl-auto=create AND hibernate.hbm2ddl.auto=update, which
# conflict. See notes/chapter-7 §7.4.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# No explicit dialect: Hibernate 6 detects MySQL from the connection, and the
# reference's MySQL8Dialect is deprecated.

logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO

# ---------------------------------------------------------------------------
# Actuator. /actuator/health is polled by the docker-compose healthcheck and
# gates Kong's startup. See notes/chapter-7 §7.3.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
