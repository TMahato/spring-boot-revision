# =============================================================================
# Kong declarative (DB-less) configuration. See notes/chapter-7 §10.
#
# Loaded at boot via KONG_DECLARATIVE_CONFIG. Because KONG_DATABASE=off there is
# no Postgres and no migration step — this file IS the gateway's configuration,
# version controlled like any other source file. The Admin API on :8001 is
# read-only in this mode; to change routing, edit here and restart Kong.
#
# Authentication is handled by the custom `forward-auth` plugin, applied
# GLOBALLY at the bottom of this file. Its code lives in
# infra/kong/plugins/forward-auth/ — see that handler for how it works.
# =============================================================================
_format_version: "3.0"
_transform: true

services:
  # ---------------------------------------------------------------------------
  # authService.
  #
  # forward-auth applies here too (it is global), but its `public_paths` list
  # exempts /auth/v1/login, /signup, /refreshToken and /ping — respectively
  # because you cannot require a token to obtain one, and because /ping is the
  # plugin's own upstream. This service protects itself via Spring Security.
  # ---------------------------------------------------------------------------
  - name: auth-service
    url: http://authservice:8080
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    retries: 3
    routes:
      - name: auth-routes
        paths:
          - /auth/v1
        # CRITICAL (§10.3). Kong's default is strip_path: true, which would
        # forward /auth/v1/signup to the service as /signup. AuthController maps
        # @PostMapping("auth/v1/signup") — the FULL path — so stripping produces
        # a 404 at the service while Kong reports a successful proxy.
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS]

  # ---------------------------------------------------------------------------
  # expenseService.
  # ---------------------------------------------------------------------------
  - name: expense-service
    url: http://expenseservice:9820
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    retries: 3
    routes:
      - name: expense-routes
        paths:
          - /expense/v1
        # ExpenseController is @RequestMapping("/expense/v1"), the full path.
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS]

  # ---------------------------------------------------------------------------
  # userService.
  # ---------------------------------------------------------------------------
  - name: user-service
    url: http://userservice:9810
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    retries: 3
    routes:
      - name: user-routes
        paths:
          - /user/v1
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS]

  # ---------------------------------------------------------------------------
  # dsService (Python/Flask). Note the different path prefix shape: /v1/ds
  # rather than /ds/v1, because that is what the Flask route declares.
  # ---------------------------------------------------------------------------
  - name: ds-service
    url: http://dsservice:8010
    connect_timeout: 5000
    # Long read timeout on purpose: this endpoint waits on an LLM call, which
    # can take several seconds. It is the one route here where the timeout is
    # load-bearing rather than incidental.
    read_timeout: 120000
    write_timeout: 60000
    # retries: 0 — a retry would re-run the LLM extraction AND republish to
    # Kafka, so a timeout that actually succeeded server-side would produce a
    # duplicate expense. Let the client decide whether to retry.
    retries: 0
    routes:
      - name: ds-routes
        paths:
          - /v1/ds
        strip_path: false
        methods: [GET, POST, OPTIONS]

# -----------------------------------------------------------------------------
# Global plugins — the "cross-cutting concerns in one place" argument for having
# a gateway at all (§9). Configured once here instead of in every service.
# Order at runtime is by plugin PRIORITY, not by position in this list.
# -----------------------------------------------------------------------------
plugins:

  # Authentication for every route. Calls authService's /auth/v1/ping, and
  # injects the resolved userId as X-User-Id for the upstream service.
  #
  # PRIORITY 800 puts it AFTER rate-limiting (901), so a flood of anonymous
  # requests is throttled before it can be amplified into a flood of pings at
  # the auth service.
  #
  # Code: infra/kong/plugins/forward-auth/{handler,schema}.lua
  - name: forward-auth
    config:
      auth_endpoint: http://authservice:8080/auth/v1/ping
      upstream_header: X-User-Id
      timeout: 5000
      # Endpoints that must NOT require a token. Removing /auth/v1/ping from
      # this list makes every request recurse into itself.
      public_paths:
        - /auth/v1/login
        - /auth/v1/signup
        - /auth/v1/refreshToken
        - /auth/v1/ping
      # 0 = ask authService on every request. Raise it (e.g. 30) to trade
      # immediate revocation for fewer round trips.
      cache_ttl: 0

  # Stamps X-Request-ID on every request (generating one if the client didn't
  # send it) and echoes it back on the response. This is what lets you follow a
  # single request across Kong -> dsService -> Kafka -> expenseService.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true

  # policy MUST be "local" in DB-less mode (§10.4): "cluster" needs a database
  # and "redis" needs a Redis container. local keeps counters in Kong's own
  # memory, which is correct for a single gateway node.
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      hide_client_headers: false

  # Rejects oversized bodies at the edge so they never reach a service.
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
