spring.application.name=ExpenseTracker
server.port=8080

# ---------------------------------------------------------------------------
# Database (MySQL) — users, roles and refresh tokens.
#
# This service owns the `authservice` schema; the user service owns
# `userservice`. Separate schemas on a shared server: still database-per-service
# (neither reads the other's tables), without a second container in dev.
#
# Under docker compose MYSQL_HOST is the compose SERVICE NAME `mysql`, not an IP
# and not localhost — inside a container `localhost` is that container, and
# container IPs change on every recreate. See notes/chapter-7 §5.
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:authservice}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

# `update` keeps data across restarts, so the mysql-data volume is meaningful.
# Override with JPA_DDL_AUTO=create for a clean slate. See notes/chapter-7 §7.4.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
# Hibernate created the unique constraints on users.username and tokens.token
# from the @Column(unique = true) declarations on the entities.

# ---------------------------------------------------------------------------
# Kafka (spring-kafka). Override the broker with KAFKA_BOOTSTRAP_SERVERS.
# Remember: a remote broker must advertise a reachable address —
# advertised.listeners=PLAINTEXT://<host-ip>:9092 in its server.properties,
# otherwise clients connect once and then time out. See notes/chapter-5 §8.3.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer: String key (use the entity id, so all events for one id keep their
# order within a partition), JSON value.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.jassi.expensetracker.serializer.UserInfoSerializer
# acks=all -> wait for all in-sync replicas; safest against broker failure.
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# No consumer config here: this service only PRODUCES user events. The consumer
# (user-service) is a separate project and owns its own group-id and deserializer.

# Topic names. Kept as app.* (not spring.kafka.*) because these are our own
# settings, not Boot's — inject with @Value("${app.kafka.topic.name}") so the
# name lives here instead of being hardcoded in the producer.
app.kafka.topic.name=user-info-topic

# ---------------------------------------------------------------------------
# JWT signing secret (HS256) for our own access/refresh tokens (jjwt).
# Use an env var / secret manager in production — never commit a real secret.
# ---------------------------------------------------------------------------
# app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-256-bit-secret}
# app.jwt.access-token-ttl-minutes=15
# app.jwt.refresh-token-ttl-days=7

# ---------------------------------------------------------------------------
# Actuator. /actuator/health is what the docker-compose healthcheck polls, and
# what gates `depends_on: condition: service_healthy` for Kong.
# show-details=always exposes the individual DataSource/Kafka checks — useful
# while learning; restrict it to when-authorized before this is public.
# NOTE: SecurityConfig must permitAll() this path, or the healthcheck gets a 401
# and the container never becomes healthy. See notes/chapter-7 §7.3.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
