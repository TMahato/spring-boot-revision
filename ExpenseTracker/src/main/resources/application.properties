spring.application.name=ExpenseTracker
server.port=8080

# ---------------------------------------------------------------------------
# Database (MongoDB) — Dockerized Mongo on the other laptop (192.168.29.195) on the LAN.
# The container must publish 27017 (docker run -p 27017:27017) and the host firewall
# must allow inbound TCP 27017. If appuser was created via MONGO_INITDB_ROOT_* it lives
# in the 'admin' db — then change authSource=mydb to authSource=admin below.
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=mongodb://appuser:AppPass123@192.168.29.195:27017/mydb?authSource=mydb
# Create the @Indexed(unique=true) indexes (username, token) automatically on startup.
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# JWT signing secret (HS256) for our own access/refresh tokens (jjwt).
# Use an env var / secret manager in production — never commit a real secret.
# ---------------------------------------------------------------------------
# app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-256-bit-secret}
# app.jwt.access-token-ttl-minutes=15
# app.jwt.refresh-token-ttl-days=7
