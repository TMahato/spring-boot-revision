name: Deploy Infrastructure (CDK)

on:
  push:
    branches:
      - main
    paths:
      - 'ExpenseTracker/cdk/**'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:        # lets you run it manually from the Actions tab

env:
  AWS_REGION: ap-south-1
  CDK_DIR: ExpenseTracker/cdk
  STACK_NAME: ExpenseTrackerNetworkStack
  BUCKET_NAME: expensetrackerinfra
  INFRA_FILE_NAME: cdk-outputs.json

# Never let two infra deploys run at once — CloudFormation rejects the
# second one mid-update anyway.
concurrency:
  group: expense-tracker-infrastructure
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest

    # Every run: step executes inside the CDK project, so npm and cdk find
    # package.json and cdk.json without any --app / --cwd flags.
    defaults:
      run:
        working-directory: ExpenseTracker/cdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ExpenseTracker/cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # CDK needs a bootstrap stack (CDKToolkit) in every account/region it
      # deploys into: an assets bucket plus the roles the CLI assumes.
      # Idempotent — a no-op once it exists.
      - name: Bootstrap CDK environment
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "Bootstrapping aws://$ACCOUNT_ID/$AWS_REGION"
          npx cdk bootstrap "aws://$ACCOUNT_ID/$AWS_REGION"

      # Prints the resource-level diff into the build log, so the deploy that
      # follows is auditable after the fact.
      - name: Diff against deployed stack
        run: npx cdk diff || true

      - name: Deploy
        run: |
          npx cdk deploy --all \
            --require-approval never \
            --outputs-file "$INFRA_FILE_NAME"
          cat "$INFRA_FILE_NAME"

      # SSM Parameter Store (/expense-tracker/*) is the real handoff to later
      # stacks. This copy is for humans and for anything outside CDK.
      - name: Upload infrastructure outputs to S3
        run: |
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Creating bucket $BUCKET_NAME"
            aws s3 mb "s3://$BUCKET_NAME" --region "$AWS_REGION"
          else
            echo "Bucket $BUCKET_NAME already exists"
          fi
          echo "Uploading to bucket: $BUCKET_NAME"
          aws s3 cp "$INFRA_FILE_NAME" "s3://$BUCKET_NAME/$INFRA_FILE_NAME"

      - name: Keep outputs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-outputs
          path: ${{ env.CDK_DIR }}/${{ env.INFRA_FILE_NAME }}
